services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: bazigb
      POSTGRES_DB: bazigb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazigb"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: node:20-slim
    restart: always
    working_dir: /app
    command: node apps/server/dist/main.js
    environment:
      DATABASE_URL: postgres://bazigb:${POSTGRES_PASSWORD}@db:5432/bazigb
      JWT_SECRET: ${JWT_SECRET}
      DOMAIN: ${DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SMSIR_API_KEY: ${SMSIR_API_KEY}
      SMSIR_TEMPLATE_ID: ${SMSIR_TEMPLATE_ID}
      NODE_ENV: production
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-slim
    restart: always
    working_dir: /app
    command: node_modules/.bin/next start apps/web
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
      NEXT_PUBLIC_SOCKET_URL: https://${DOMAIN}
      DOMAIN: ${DOMAIN}
      NODE_ENV: production
    volumes:
      - .:/app

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
